name: Deploy to Server via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject DB credentials into config
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          python3 - <<'EOF'
          import os, re
          with open('config/config.php', 'r') as f:
              c = f.read()
          c = c.replace('your_database_name', os.environ['DB_NAME'])
          c = c.replace('your_database_user', os.environ['DB_USER'])
          c = c.replace('your_database_password', os.environ['DB_PASS'])
          c = c.replace('your_database_host', os.environ['DB_HOST'])
          c = c.replace("'development'", "'production'")
          with open('config/config.php', 'w') as f:
              f.write(c)
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
