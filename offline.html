<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Mrs B Fitness Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #4a1942;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .wrap { max-width: 340px; }
        img { width: 120px; height: 120px; margin-bottom: 1.5rem; border-radius: 20px; }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; color: #fff; }
        p  { color: #d9c9d7; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .btn {
            display: inline-block;
            background: #d4136e;
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .dot { display: inline-block; width: 8px; height: 8px; background: #d4136e; border-radius: 50; margin: 0 3px; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/assets/img/icons/icon-192.png" alt="Mrs B Fitness">
        <h1>You're offline</h1>
        <p>
            It looks like you don't have an internet connection right now.
            Connect to Wi-Fi or mobile data to access your tracker.
        </p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
